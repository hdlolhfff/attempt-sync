name: Build Attempt Sync
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++23 -Wall -Wextra -Werror -O2 tests/apx_test.cpp -o /tmp/apx-test && /tmp/apx-test
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Win64
          - os: macos-latest
            target: MacOS
          - os: macos-latest
            target: iOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@dce36b35e1c3d9d8af92347760b12eba3caf4004
        with:
          sdk: given
          target: ${{ matrix.target }}
          combine: true
          bindings-ref: acb2c10d5de79fecec11e6f91f5e929447738b2e
          # The shared writer token comes from a repository secret and is baked
          # into the binary only. It is never in this repository; clear or
          # rotate the secret to ship a viewer-only build.
          configure-args: >-
            -DSKIP_BUILDING_CODEGEN=OFF
            -DATTEMPT_SYNC_SHARED_TOKEN=${{ secrets.ATTEMPT_SYNC_SHARED_TOKEN }}
      - name: Verify packaged iOS signature
        if: matrix.target == 'iOS'
        shell: bash
        run: |
          python3 scripts/verify_ios_signature.py output/local.attempt_sync.geode
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('output/local.attempt_sync.geode') as archive:
              archive.extract('local.attempt_sync.ios.dylib', os.environ['RUNNER_TEMP'])
          PY
          codesign --verify --strict "$RUNNER_TEMP/local.attempt_sync.ios.dylib"
  package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod/combine@dce36b35e1c3d9d8af92347760b12eba3caf4004
        id: package
        with:
          # The signature verifier reads the packaged dylib with Python zipfile.
          zstd: false
      - name: Verify combined package retains the iOS signature
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.build-output }}
        run: python3 scripts/verify_ios_signature.py "$PACKAGE_DIR/local.attempt_sync.geode"
      - uses: actions/upload-artifact@v4
        with:
          name: Attempt-Sync-All-Platforms
          path: ${{ steps.package.outputs.build-output }}
