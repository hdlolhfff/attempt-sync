name: Publish tested mod
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful Build Attempt Sync run to publish
        required: true
        default: '38347824064'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify build run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.run-id }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > /tmp/build-run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/build-run.json'))
          assert r['conclusion']=='success' and r['name']=='Build Attempt Sync'
          assert r['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('sha='+r['head_sha']+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Attempt-Sync-All-Platforms
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish initial test release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ steps.verify.outputs.sha }}
        shell: bash
        run: |
          git archive --format=zip --prefix=attempt-sync/ "$TESTED_SHA" -o attempt-sync-source.zip
          gh release create v1.0.0 dist/local.attempt_sync.geode attempt-sync-source.zip --repo "$GITHUB_REPOSITORY" --target "$TESTED_SHA" --title 'Attempt Sync 1.0.0 — initial test build' --prerelease --notes-file release/NOTES.md
